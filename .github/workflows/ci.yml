name: AutoDM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio respx
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint with ruff
        run: |
          ruff check backend/ || true

      - name: Run backend tests
        env:
          MOCK_SOCIAL_API: "true"
          MOCK_LLM: "true"
          APP_ENV: "test"
        run: |
          if [ -d backend/tests ]; then pytest backend/tests; fi

  frontend-lint-and-test:
    name: Frontend Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm ci; fi

      - name: Lint frontend
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm run lint || true; fi

      - name: Run vitest
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm test -- --run || true; fi
