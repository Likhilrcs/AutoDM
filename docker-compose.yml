version: "3.8"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: autodm_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_ENV: development

      DATABASE_URL: ${DATABASE_URL}
      LANGGRAPH_CHECKPOINT_DB_URL: ${LANGGRAPH_CHECKPOINT_DB_URL}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      MOCK_SOCIAL_API: "true"
      MOCK_LLM: "false"

      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.1-8b-instant
      GROQ_API_KEY: ${GROQ_API_KEY}

    volumes:
      - ./backend:/app